[build]
  # Directory to run the build command in (the subdirectory containing package.json)
  base = "client"
  
  # Directory where the build command is run
  command = "npm run build"
  
  # Directory that contains the deploy-ready HTML files and assets generated by the build
  # This is relative to the 'base' directory
  publish = "dist"

# Handle Single Page Application (SPA) routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
